name: Compatibility Matrix

# The full engine x Gradle x AGP x Kotlin x JDK matrix (plugin-test `matrixTest`, tag "matrix").
# Too slow for every PR: runs nightly, on demand, and on PRs labelled "matrix".
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

jobs:
  matrix:
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'matrix') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Setup java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          # The last one listed becomes JAVA_HOME; the matrix finds 22 via JAVA_HOME_22_X64.
          java-version: |
            22
            17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run compatibility matrix
        run: ./gradlew -p plugin-test :foundation:matrixTest --continue
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-test-reports
          path: plugin-test/foundation/build/reports/tests/
          if-no-files-found: warn
